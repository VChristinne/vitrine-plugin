name: Close outside pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Close it with a note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment \
            "Thanks for taking the time — but Vitrine doesn't take pull requests. It's a personal plugin developed in one vault, and this repository publishes it rather than opening it up, so this is closed unread. That's a policy, not a judgement of the work.

          If it started as a bug, please open an issue and it gets fixed: https://github.com/$GITHUB_REPOSITORY/issues/new/choose

          And the licence is MIT — fork it and take it wherever you like."

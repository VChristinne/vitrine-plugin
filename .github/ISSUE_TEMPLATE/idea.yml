name: Idea
description: Suggest something Vitrine could do
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Vitrine is shaped around one person's vault, so ideas are welcome but land
        only when they fit that shape. Saying what you are trying to do beats saying
        which feature to add.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The workflow you are after, not the feature you have in mind for it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this one is new.
          required: true
